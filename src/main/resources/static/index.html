<!doctype html>
<html lang="bg">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оценки | Student Assessment</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header><div class="brand">🎓 <span>Student Assessment</span></div><button id="logout" class="hidden">Изход</button></header>
<main>
  <section id="login" class="card login-card"><h1>Система за оценяване</h1><p class="muted">Вход за преподаватели и студенти</p>
    <form id="loginForm"><input id="username" placeholder="Потребителско име" required><input id="password" type="password" placeholder="Парола" required><button>Вход</button></form>
    <p id="loginError" class="error"></p><small>Демо: <b>student / student123</b> или <b>teacher / teacher123</b></small>
  </section>
  <section id="app" class="hidden"><div class="welcome"><div><h1 id="welcome"></h1><p class="muted">Преглед на учебния напредък</p></div><span id="role" class="badge"></span></div>
    <div class="grid"><div class="card"><h2>Моите оценки</h2><div id="grades"></div></div><div class="card"><h2>Предстоящи задачи</h2><div id="assignments"></div></div></div>
    <div class="card"><h2>Дисциплини</h2><div id="courses" class="course-grid"></div></div>
  </section>
</main><script src="/js/app.js"></script>
</body></html>
